appId: dev.swaythepeople.app
productName: SwayThePeople
directories:
  output: dist
  buildResources: build
files:
  - out/**
npmRebuild: false
# Linux sandbox fallback launcher — see the hook's header comment.
afterPack: scripts/after-pack.cjs
# Predictable artifact names so CI upload steps can glob them.
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
linux:
  target:
    - AppImage
    - deb
  category: Game
  maintainer: Tiago Ceccon <ceccon.t@hotmail.com>
  icon: build/icon.png
deb:
  afterInstall: scripts/deb/postinst.sh
  afterRemove: scripts/deb/postrm.sh
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.png
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
mac:
  target:
    - target: dmg
      arch:
        - arm64
        - x64
  category: public.app-category.games
  icon: build/icon.png
  # No signing certificate yet; produce unsigned builds deterministically.
  identity: null
